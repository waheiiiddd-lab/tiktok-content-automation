name: Auto Viral TikTok Content

on:
  schedule:
    # Berjalan otomatis setiap hari jam 09:00 WIB (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch: # Tombol buat tes manual

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4 # Update ke v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5 # Update ke v5 (lebih stabil di 2026)
        with:
          python-version: '3.10' # Menggunakan Python yang lebih modern

      - name: 3. Install Dependencies, Fonts & ImageMagick
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y google google-cloud-aiplatform google-generativeai google-api-core
          pip install google-genai moviepy requests
          
          sudo apt-get update
          # Tambahkan fonts-dejavu-core agar TextClip tidak error
          sudo apt-get install -y imagemagick fonts-dejavu-core
          
          # Policy ImageMagick
          sudo sed -i 's/domain="path" rights="none" pattern="@\*"/domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

      - name: 4. Jalankan Robot AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_NAME: "Produk Viral Hari Ini" 
        run: python main.py

      - name: 5. Simpan Hasil (Fix Deprecation)
        uses: actions/upload-artifact@v4 # INI DIA PERBAIKANNYA (Update ke v4)
        with:
          name: video-hasil-harian
          path: video_viral.mp4
          retention-days: 1 # Biar gak menuhin storage GitHub kamu
          
