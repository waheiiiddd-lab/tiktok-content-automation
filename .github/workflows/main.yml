name: Auto Viral TikTok Content

on:
  schedule:
    # Berjalan otomatis setiap hari jam 02:00 UTC (Jam 09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch: # Memunculkan tombol "Run Workflow" buat tes manual

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v3

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Install Dependencies & ImageMagick
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # Perbaikan kebijakan ImageMagick agar bisa merender teks
          sudo sed -i 's/domain="path" rights="none" pattern="@\*"/domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

      - name: 4. Jalankan Robot AI
        env:
          # Mengambil kunci rahasia dari GitHub Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Nama produk bisa diubah di sini jika mau ganti judul lewat yml
          PRODUCT_NAME: "Produk Viral Hari Ini" 
        run: python main.py

      - name: 5. Simpan Hasil (Optional)
        uses: actions/upload-artifact@v3
        with:
          name: video-hasil-harian
          path: video_viral.mp4
          
